name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database
        run: supabase db reset

      - name: Run SQL and RLS suites
        run: npm run test:rls

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  deploy:
    name: Deploy to Cloudflare Workers
    needs: quality
    # Only after quality passes on main — never on pull requests. Also allows
    # a manual redeploy (Actions tab -> Run workflow) without a new push.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # wrangler 4.x requires Node >= 22 (the quality job stays on 20, this
        # repo's documented minimum — only the wrangler CLI itself needs 22).
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_DATA_SOURCE: supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_DOMAIN: merbsconnect.com

      - name: Deploy to Cloudflare Workers
        # Calling wrangler directly (rather than cloudflare/wrangler-action)
        # so `npx wrangler` resolves the ^4.114.0 devDependency npm ci just
        # installed into node_modules — the same command `npm run deploy`
        # runs locally. The wrangler-action's `wranglerVersion` input did not
        # override its own bundled (older, wrangler 3.x) default, which
        # cannot deploy an assets-only (no `main`) Worker.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
